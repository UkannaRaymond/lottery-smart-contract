[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1

remappings = [
    "@chainlink/contracts/=lib/chainlink-evm/contracts/",
    "@openzeppelin/contracts@4.9.6/=lib/openzeppelin-contracts/contracts/",  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
]

ignored_error_codes = [2424, 5574, 3860, 6335]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
